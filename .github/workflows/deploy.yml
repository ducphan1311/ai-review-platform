name: Deploy to GitHub Pages with Secrets Injection

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Inject Secrets into Static Portal
        run: |
          echo "Injecting Supabase configuration from GitHub Secrets..."
          sed -i 's|__SUPABASE_URL_PLACEHOLDER__|${{ secrets.SUPABASE_URL }}|g' index.html
          sed -i 's|__SUPABASE_ANON_KEY_PLACEHOLDER__|${{ secrets.SUPABASE_ANON_KEY }}|g' index.html
          echo "Verification: Checking placeholders replacement status"
          if grep -q "__SUPABASE_ANON_KEY_PLACEHOLDER__" index.html; then
            echo "Error: Placeholder not replaced!"
            exit 1
          fi
          echo "Secrets injection completed successfully without exposing raw keys in git history."

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
